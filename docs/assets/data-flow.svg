<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="408" viewBox="0 0 1060 408" role="img" aria-labelledby="title desc"><title id="title">数字是怎样进入一张图的</title><desc id="desc">完整数据用于统计；图表预览有显示上限；报告从查询重新计算。 原始文本，保留 UTF-8 内容指纹，合成数据附来源标识；结构化字段，解析类型与空值，概览与配对有效性检查；明确的查询，选轴 · 聚合 · 有效样本，MoonBit 按计算契约执行；图表与报告，显示数量和排除行数，统计、参数、来源一起导出</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="m1 1 5 3-5 3" fill="none" stroke="#66816e" stroke-width="1.5"/></marker></defs><rect width="1060" height="408" rx="20" fill="#fff"/><g font-family="Microsoft YaHei,system-ui,sans-serif" fill="#29493c"><text x="32" y="35" font-size="11" letter-spacing="3" fill="#708574">MOONDATA LAB / DATA-FLOW</text><text x="32" y="79" font-size="29" font-weight="700">数字是怎样进入一张图的</text><text x="32" y="109" font-size="14" fill="#5a7163">完整数据用于统计；图表预览有显示上限；报告从查询重新计算。</text><g transform="translate(32 150)"><rect width="230" height="188" rx="24" fill="#eef6ed" stroke="#dce5de"/><circle cx="39" cy="39" r="20" fill="#fff"/><text x="39" y="44" text-anchor="middle" font-size="11" font-weight="700">IN</text><text x="22" y="92" font-size="21" font-weight="700">原始文本</text><text x="22" y="124" font-size="13">保留 UTF-8 内容指纹</text><text x="22" y="149" font-size="13">合成数据附来源标识</text><path d="M179 35q8 -16 16 0q-8 16 -16 0" fill="none" stroke="#94aa99" stroke-width="2"/></g><g transform="translate(286 150)"><rect width="230" height="188" rx="24" fill="#fff2e5" stroke="#dce5de"/><circle cx="39" cy="39" r="20" fill="#fff"/><text x="39" y="44" text-anchor="middle" font-size="11" font-weight="700">TYPE</text><text x="22" y="92" font-size="21" font-weight="700">结构化字段</text><text x="22" y="124" font-size="13">解析类型与空值</text><text x="22" y="149" font-size="13">概览与配对有效性检查</text><path d="M179 35q8 -16 16 0q-8 16 -16 0" fill="none" stroke="#94aa99" stroke-width="2"/></g><g transform="translate(540 150)"><rect width="230" height="188" rx="24" fill="#edf2fb" stroke="#dce5de"/><circle cx="39" cy="39" r="20" fill="#fff"/><text x="39" y="44" text-anchor="middle" font-size="11" font-weight="700">MATH</text><text x="22" y="92" font-size="21" font-weight="700">明确的查询</text><text x="22" y="124" font-size="13">选轴 · 聚合 · 有效样本</text><text x="22" y="149" font-size="13">MoonBit 按计算契约执行</text><path d="M179 35q8 -16 16 0q-8 16 -16 0" fill="none" stroke="#94aa99" stroke-width="2"/></g><g transform="translate(794 150)"><rect width="230" height="188" rx="24" fill="#f7eef6" stroke="#dce5de"/><circle cx="39" cy="39" r="20" fill="#fff"/><text x="39" y="44" text-anchor="middle" font-size="11" font-weight="700">OUT</text><text x="22" y="92" font-size="21" font-weight="700">图表与报告</text><text x="22" y="124" font-size="13">显示数量和排除行数</text><text x="22" y="149" font-size="13">统计、参数、来源一起导出</text><path d="M179 35q8 -16 16 0q-8 16 -16 0" fill="none" stroke="#94aa99" stroke-width="2"/></g><g fill="none" stroke="#66816e" stroke-width="2" marker-end="url(#arrow)"><path d="M262 244h24"/><path d="M516 244h24"/><path d="M770 244h24"/></g><text x="32" y="382" font-size="12" fill="#657a6d">MAKE DATA. FIND ANSWERS.   ·   人确认方向，工具留下证据。</text></g></svg>