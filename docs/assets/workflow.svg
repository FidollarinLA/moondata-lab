<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="408" viewBox="0 0 1060 408" role="img" aria-labelledby="title desc"><title id="title">从一张表，到可核对的答案</title><desc id="desc">先看字段，再选坐标；每一步都保留人的选择。 带来数据，上传 CSV / JSON / JSONL，或确认合成方案后生成；认识这张表，查看类型、缺失与来源，选择 X / Y 与聚合方式；画图与核对，MoonBit 计算有效样本，对照参数、排除行和方法；带走结果，下载图表、表格与报告，用来源指纹追溯这次计算</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="m1 1 5 3-5 3" fill="none" stroke="#66816e" stroke-width="1.5"/></marker></defs><rect width="1060" height="408" rx="20" fill="#fff"/><g font-family="Microsoft YaHei,system-ui,sans-serif" fill="#29493c"><text x="32" y="35" font-size="11" letter-spacing="3" fill="#708574">MOONDATA LAB / WORKFLOW</text><text x="32" y="79" font-size="29" font-weight="700">从一张表，到可核对的答案</text><text x="32" y="109" font-size="14" fill="#5a7163">先看字段，再选坐标；每一步都保留人的选择。</text><g transform="translate(32 150)"><rect width="230" height="188" rx="24" fill="#eef6ed" stroke="#dce5de"/><circle cx="39" cy="39" r="20" fill="#fff"/><text x="39" y="44" text-anchor="middle" font-size="11" font-weight="700">01</text><text x="22" y="92" font-size="21" font-weight="700">带来数据</text><text x="22" y="124" font-size="13">上传 CSV / JSON / JSONL</text><text x="22" y="149" font-size="13">或确认合成方案后生成</text><path d="M179 35q8 -16 16 0q-8 16 -16 0" fill="none" stroke="#94aa99" stroke-width="2"/></g><g transform="translate(286 150)"><rect width="230" height="188" rx="24" fill="#fff2e5" stroke="#dce5de"/><circle cx="39" cy="39" r="20" fill="#fff"/><text x="39" y="44" text-anchor="middle" font-size="11" font-weight="700">02</text><text x="22" y="92" font-size="21" font-weight="700">认识这张表</text><text x="22" y="124" font-size="13">查看类型、缺失与来源</text><text x="22" y="149" font-size="13">选择 X / Y 与聚合方式</text><path d="M179 35q8 -16 16 0q-8 16 -16 0" fill="none" stroke="#94aa99" stroke-width="2"/></g><g transform="translate(540 150)"><rect width="230" height="188" rx="24" fill="#edf2fb" stroke="#dce5de"/><circle cx="39" cy="39" r="20" fill="#fff"/><text x="39" y="44" text-anchor="middle" font-size="11" font-weight="700">03</text><text x="22" y="92" font-size="21" font-weight="700">画图与核对</text><text x="22" y="124" font-size="13">MoonBit 计算有效样本</text><text x="22" y="149" font-size="13">对照参数、排除行和方法</text><path d="M179 35q8 -16 16 0q-8 16 -16 0" fill="none" stroke="#94aa99" stroke-width="2"/></g><g transform="translate(794 150)"><rect width="230" height="188" rx="24" fill="#f7eef6" stroke="#dce5de"/><circle cx="39" cy="39" r="20" fill="#fff"/><text x="39" y="44" text-anchor="middle" font-size="11" font-weight="700">04</text><text x="22" y="92" font-size="21" font-weight="700">带走结果</text><text x="22" y="124" font-size="13">下载图表、表格与报告</text><text x="22" y="149" font-size="13">用来源指纹追溯这次计算</text><path d="M179 35q8 -16 16 0q-8 16 -16 0" fill="none" stroke="#94aa99" stroke-width="2"/></g><g fill="none" stroke="#66816e" stroke-width="2" marker-end="url(#arrow)"><path d="M262 244h24"/><path d="M516 244h24"/><path d="M770 244h24"/></g><text x="32" y="382" font-size="12" fill="#657a6d">MAKE DATA. FIND ANSWERS.   ·   人确认方向，工具留下证据。</text></g></svg>