<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="408" viewBox="0 0 1060 408" role="img" aria-labelledby="title desc"><title id="title">把理解、计算与呈现分开</title><desc id="desc">模型提出配置；受限工具执行；计算结果可以独立复核。 浏览器工作台，中文表单 · 选轴 · 对话，SVG 图表与结果下载；Node 编排层，本机会话 · 校验 · 工具边界，不执行模型生成的代码；MoonBit 核心，CSV · 生成器 · 统计 · 聚合，JS / Wasm GC 双后端验证；可选模型，本地 Qwen / 远程工具模型，通过编排层调用受限工具</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="m1 1 5 3-5 3" fill="none" stroke="#66816e" stroke-width="1.5"/></marker></defs><rect width="1060" height="408" rx="20" fill="#fff"/><g font-family="Microsoft YaHei,system-ui,sans-serif" fill="#29493c"><text x="32" y="35" font-size="11" letter-spacing="3" fill="#708574">MOONDATA LAB / ARCHITECTURE</text><text x="32" y="79" font-size="29" font-weight="700">把理解、计算与呈现分开</text><text x="32" y="109" font-size="14" fill="#5a7163">模型提出配置；受限工具执行；计算结果可以独立复核。</text><g transform="translate(32 150)"><rect width="230" height="188" rx="24" fill="#eef6ed" stroke="#dce5de"/><circle cx="39" cy="39" r="20" fill="#fff"/><text x="39" y="44" text-anchor="middle" font-size="11" font-weight="700">UI</text><text x="22" y="92" font-size="21" font-weight="700">浏览器工作台</text><text x="22" y="124" font-size="13">中文表单 · 选轴 · 对话</text><text x="22" y="149" font-size="13">SVG 图表与结果下载</text><path d="M179 35q8 -16 16 0q-8 16 -16 0" fill="none" stroke="#94aa99" stroke-width="2"/></g><g transform="translate(286 150)"><rect width="230" height="188" rx="24" fill="#fff2e5" stroke="#dce5de"/><circle cx="39" cy="39" r="20" fill="#fff"/><text x="39" y="44" text-anchor="middle" font-size="11" font-weight="700">API</text><text x="22" y="92" font-size="21" font-weight="700">Node 编排层</text><text x="22" y="124" font-size="13">本机会话 · 校验 · 工具边界</text><text x="22" y="149" font-size="13">不执行模型生成的代码</text><path d="M179 35q8 -16 16 0q-8 16 -16 0" fill="none" stroke="#94aa99" stroke-width="2"/></g><g transform="translate(540 150)"><rect width="230" height="188" rx